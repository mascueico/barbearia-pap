<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Dropdown Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        select {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Teste Funcionários</h1>
    <select id="funcionarios"></select>

    <script>
        async function loadFuncionarios() {
            try {
                const response = await fetch('http://localhost:3000/funcionarios');
                const funcs = await response.json();
                const select = document.getElementById('funcionarios');
                
                select.innerHTML = '<option value="">-- Escolha um funcionário --</option>';
                
                funcs.forEach(func => {
                    const option = document.createElement('option');
                    option.value = func.id_funcionario;
                    option.textContent = func.nome_completo;
                    select.appendChild(option);
                });

                console.log('Funcionários carregados:', funcs);
                alert('Funcionários carregados: ' + funcs.map(f => f.nome_completo).join(', '));
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar funcionários');
            }
        }

        loadFuncionarios();
    </script>
</body>
</html>
