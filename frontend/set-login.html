<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Set Login Token</h2>
        <button onclick="setLoginToken()">Set Test Token</button>
        <p id="status"></p>
    </div>

    <script>
        function setLoginToken() {
            const testToken = JSON.stringify({
                id_cliente: 1,
                nome_cliente: "Test User",
                email: "teste@example.com",
                telefone: "123456789"
            });
            localStorage.setItem("loggedInUser", testToken);
            document.getElementById("status").textContent = "Login token set successfully!";
            setTimeout(() => {
                window.location.href = "marcar.html";
            }, 1000);
        }
    </script>
</body>
</html>
