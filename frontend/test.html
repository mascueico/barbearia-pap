<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Funcionarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #funcionarios-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Teste Funcionarios</h1>
    <div id="funcionarios-list"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch("http://localhost:3000/funcionarios");
                if (!res.ok) throw new Error(`Erro na API funcionarios: ${res.status}`);
                const funcionarios = await res.json();
                const listDiv = document.getElementById("funcionarios-list");
                listDiv.innerHTML = `<h3>Funcionários carregados:</h3>`;
                funcionarios.forEach(f => {
                    listDiv.innerHTML += `<p>${f.id_funcionario}: ${f.nome_completo}</p>`;
                });
            } catch (err) {
                console.error(err);
                document.getElementById("funcionarios-list").innerHTML = `<p>Erro ao carregar funcionários</p>`;
            }
        });
    </script>
</body>
</html>
