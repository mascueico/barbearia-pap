<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbearia Flokiko</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .login-header {
            background: #1a1a1a;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .login-header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .login-header p {
            margin: 5px 0 0;
            opacity: 0.9;
        }

        .login-form-container {
            padding: 30px;
        }

        .form-toggle {
            display: flex;
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: white;
            border: none;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #1a1a1a;
            color: white;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Password visibility toggle */
        .password-input-container {
            position: relative;
        }

        .password-input-container .form-control {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #1a1a1a;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-header h1 {
                font-size: 2rem;
            }

            .login-form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1><i class="fas fa-cut"></i> Barbearia Flokiko</h1>
                <p>Bem-vindo à sua barbearia preferida</p>
            </div>

            <div class="login-form-container">
                <div class="alert" id="alert"></div>

                <div class="form-toggle">
                    <button class="toggle-btn active" data-form="login">Login</button>
                    <button class="toggle-btn" data-form="register">Registar</button>
                </div>

                <!-- Formulário de Login -->
                <div id="login-form" class="form-section active">
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" class="form-control" placeholder="seu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Palavra-passe</label>
                            <div class="password-input-container">
                                <input type="password" id="login-password" class="form-control" placeholder="Sua senha" required>
                                <i class="fas fa-eye password-toggle" id="toggle-login-password" onclick="togglePasswordVisibility('login-password', 'toggle-login-password')"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Entrar
                        </button>
                    </form>
                </div>

                <!-- Formulário de Registo -->
                <div id="register-form" class="form-section">
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label for="register-name">Nome completo</label>
                            <input type="text" id="register-name" class="form-control" placeholder="Seu nome" required>
                        </div>
                        <div class="form-group">
                            <label for="register-email">Email</label>
                            <input type="email" id="register-email" class="form-control" placeholder="seu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="register-phone">Telefone</label>
                            <input type="tel" id="register-phone" class="form-control" placeholder="912 345 678" required>
                        </div>
                        <div class="form-group">
                            <label for="register-password">Palavra-passe</label>
                            <div class="password-input-container">
                                <input type="password" id="register-password" class="form-control" placeholder="Crie uma senha" required>
                                <i class="fas fa-eye password-toggle" id="toggle-register-password" onclick="togglePasswordVisibility('register-password', 'toggle-register-password')"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="register-confirm-password">Confirmar palavra-passe</label>
                            <div class="password-input-container">
                                <input type="password" id="register-confirm-password" class="form-control" placeholder="Confirme sua senha" required>
                                <i class="fas fa-eye password-toggle" id="toggle-register-confirm-password" onclick="togglePasswordVisibility('register-confirm-password', 'toggle-register-confirm-password')"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-user-plus"></i> Registar
                        </button>
                    </form>
                </div>

                <div class="back-link">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Voltar à página inicial</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
