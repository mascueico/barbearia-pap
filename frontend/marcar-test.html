<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcar Agendamento</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        .user-info {
            background-color: #f5f5f5;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info .user-details {
            display: flex;
            align-items: center;
        }
        .user-info .user-details i {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>FLOKIKO BARBERSHOP</h1>
                <nav>
                    <a href="index.html">Início</a>
                    <a href="servicos.html">Serviços</a>
                    <a href="marcar.html">Agendamentos</a>
                    <a href="contacto.html">Contacto</a>
                    <a href="barbeiros.html">Barbeiros</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <h2>Marcar Agendamento</h2>
            <div id="user-info-container">
                    <div class="user-details">
                    <i class="fas fa-user"></i>
                    <span>Olá, Teste User</span>
                </div>
                <button onclick="logout()">Sair</button>
            </div>
        </div>
            <form id="booking-form">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" disabled>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" disabled>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" disabled>
                </div>
                <div class="form-group">
                    <label for="id_servico">Serviço:</label>
                    <select id="id_servico">
                        <option value="">-- Selecione um serviço --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="id_funcionario">Barbeiro:</label>
                    <select id="id_funcionario">
                        <option value="">-- Selecione um barbeiro --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" min="2026-02-26">
                </div>
                <div class="form-group">
                    <label for="hora">Hora:</label>
                    <select id="hora">
                        <option value="">-- Selecione uma hora --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <button type="button" id="btnVerHoras">Ver Horários</button>
                    <button type="button" id="btnMarcar">Marcar</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2023 Flokiko Barbershop. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/marcar.js"></script>
    <script>
        // Override getLoggedInUser() to return a dummy user after marcar.js is loaded
        window.getLoggedInUser = function() {
            console.log('getLoggedInUser() called');
            return {
                id_cliente: 30,
                nome_cliente: "Teste User",
                email: "teste@example.com",
                telefone: "912345678"
            };
        };
        console.log('getLoggedInUser() overridden');
    </script>
</body>
</html>
