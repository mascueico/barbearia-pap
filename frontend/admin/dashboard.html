<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Back-office</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="login-box">
    <h2>Back-office</h2>
    <p id="welcome"></p>

    <h3>Agendamentos</h3>

    <!-- FILTROS -->
    <div class="filtros">
      <label>Estado:</label>
      <select id="filtroStatus">
        <option value="Todos">Todos</option>
        <option value="Pendente">Pendente</option>
        <option value="Confirmado">Confirmado</option>
        <option value="Cancelado">Cancelado</option>
      </select>

      <label>Data:</label>
      <input type="date" id="filtroData">

      <label>Cliente:</label>
      <input type="text" id="pesquisaCliente" placeholder="ex: João">

      <button id="btnLimparFiltros" type="button">Limpar</button>
    </div>

    <!-- TABELA -->
    <div id="agendamentosArea">A carregar...</div>

    <button id="btnLogout">Sair</button>
    <p id="msg"></p>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
