<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* Password visibility toggle */
    .password-input-container {
      position: relative;
      margin: 1rem 0;
    }

    .password-input-container input {
      padding-right: 50px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Administrador</h2>

    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <div class="password-input-container">
      <input type="password" id="password" placeholder="Palavra-passe" autocomplete="current-password">
      <i class="fas fa-eye password-toggle" id="toggle-password" onclick="togglePasswordVisibility('password', 'toggle-password')"></i>
    </div>

    <button id="btnLogin">Entrar</button>

    <p id="msg"></p>
  </div>

  <script src="js/login.js"></script>
  <script>
    // Toggle password visibility
    function togglePasswordVisibility(passwordId, toggleId) {
        console.log("Toggle function called");
        const passwordInput = document.getElementById(passwordId);
        const toggleIcon = document.getElementById(toggleId);
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }
    
    // Test function to directly call toggle
    function testToggle() {
        console.log("Test toggle called");
        togglePasswordVisibility('password', 'toggle-password');
    }
  </script>
</body>
</html>
