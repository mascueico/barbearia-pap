<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Dropdown</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Teste Dropdown de Funcionários</h1>
        
        <div class="form-group">
            <label for="id_funcionario">Barbeiro:</label>
            <select id="id_funcionario">
                <option value="">-- a carregar funcionários --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Funcionários Recebidos:</label>
            <pre id="funcionarios-list"></pre>
        </div>

        <button id="btnTest">Testar Função</button>
    </div>

    <script>
        // Função para carregar os funcionários
        async function carregarFuncionarios() {
            try {
                const response = await fetch('http://localhost:3000/funcionarios');
                const funcionarios = await response.json();

                console.log('Funcionários recebidos:', funcionarios);

                // Display the list of employees
                document.getElementById('funcionarios-list').textContent = JSON.stringify(funcionarios, null, 2);

                // Populate the dropdown
                const select = document.getElementById('id_funcionario');
                select.innerHTML = '<option value="">-- Selecione um barbeiro --</option>';
                funcionarios.forEach(funcionario => {
                    const option = document.createElement('option');
                    option.value = funcionario.id_funcionario;
                    option.textContent = funcionario.nome_completo;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('id_funcionario').innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        document.getElementById('btnTest').addEventListener('click', () => {
            const select = document.getElementById('id_funcionario');
            console.log('Opções do dropdown:', Array.from(select.options).map(option => ({ value: option.value, text: option.text })));
            console.log('Selecionado:', select.value, select.options[select.selectedIndex].text);
        });

        // Carregar os funcionários ao carregar a página
        window.addEventListener('DOMContentLoaded', carregarFuncionarios);
    </script>
</body>
</html>
